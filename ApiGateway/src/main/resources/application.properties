spring.application.name=ApiGateway
server.port = 9090

#Configuration for API Gateway for Register Microservice
spring.cloud.gateway.server.webmvc.routes[0].id=register-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:9091/
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/roles/**,/register/**